version: v2
plugins:
  # - local: protoc-gen-es
  #   out: proto
  #   opt: target=dts
  - remote: buf.build/community/stephenh-ts-proto
    out: proto
    opt:
      - useOptionals=none
      - exportCommonSymbols=false
      - snakeToCamel=false
      - removeEnumPrefix=false
      - unrecognizedEnum=false
      - onlyTypes=false
      - emitDefaultValues=json-methods
inputs:
  - directory: open-simulation-interface