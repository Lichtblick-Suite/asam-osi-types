name: Publish on GitHub Release

on:
  release:
    types:
      - published

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        run: |
          corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Build Project
        run: yarn run build

      - name: Validate package version matches release tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${TAG#v}"

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PACKAGE_VERSION) does not match release tag ($TAG)."
            exit 1
          fi

      - name: Pack Project
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          yarn pack --out "lichtblick-asam-osi-types-${VERSION}.tgz"

      - name: Publish to NPM
        run: npm publish lichtblick-asam-osi-types-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}

      - name: Upload package to GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: lichtblick-asam-osi-types-*.tgz